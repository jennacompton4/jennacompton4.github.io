<style>

    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px}
  h1{margin:0;font-size:18px;text-align:center;color:#8a4b00}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{flex:1 1 180px;min-height:48px;font-size:18px;padding:0 12px;border-radius:14px;border:2px solid #d9b36c;background:#fff;color:#222}
  label.tg{display:flex;align-items:center;gap:8px;font-size:17px;min-height:48px;padding:0 4px}
  label.tg input{width:26px;height:26px}
  .count{text-align:center;font-size:17px;color:#6b5a3a}
  #cardArea{flex:1 1 auto;min-height:200px;perspective:1200px;touch-action:none;overscroll-behavior:none;cursor:pointer;outline:none}
  #inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
  #inner.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;

  .lang{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#7a6a4a}
  .big{font-size:clamp(30px,9vw,52px);line-height:1.15;font-weight:700}
  .note{font-size:18px;color:#444}
  .hint{font-size:14px;color:#8a7a5a}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{min-height:64px;font-size:22px;font-weight:700;border-radius:18px;border:2px solid #d9b36c;background:#fff;color:#5a3a00;touch-action:manipulation}
  button:active{transform:scale(.97);background:#ffe9b8}
  button.primary{background:#ff9f1c;color:#fff;border-color:#e08500}
  .hide{display:none!important}
  #cardWrap{position:relative;flex:1 1 auto;min-height:150px;display:flex}
  #cardWrap #cardArea{flex:1 1 auto;min-height:0}
  #check{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;font-size:min(34vh,200px);font-weight:900;color:#1fa34a;text-shadow:0 4px 18px rgba(31,163,74,.45)}
  #check.show{display:flex;animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  #say{display:flex;align-items:center;gap:14px;min-height:96px}
  #mic{flex:0 0 auto;width:88px;height:88px;min-height:88px;border-radius:50%;font-size:42px;padding:0;background:#ff9f1c;color:#fff;border:3px solid #e08500;box-shadow:0 4px 12px rgba(0,0,0,.2)}

  #mic:disabled{opacity:.5}

  #status.warn{color:#e07b00}
  #heard{font-size:17px;color:#555;margin-top:4px;min-height:22px;overflow-wrap:anywhere}
  .deckname{text-align:center;font-size:15px;color:#6b5a3a}

var DECKS = ["All","Colors","Things","Describing words","Daily life","Song phrases","About me","Birthday"];
var KEY = "ochoa-spanish-flashcards-v1";
var st = {deck:"All", idx:0, eng:false, say:false};
try { var s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s && DECKS.indexOf(s.deck)>=0) { st.deck=s.deck; st.idx=s.idx|0; st.eng=!!s.eng; st.say=!!s.say; } } catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
var flipped=false, perm=null, cards=[];
function $(id){return document.getElementById(id);}
function build(){ cards = st.deck==="All" ? CARDS : CARDS.filter(function(x){return x.decks.indexOf(st.deck)>=0;}); }
function render(){
  var n=cards.length; if(st.idx<0||st.idx>=n) st.idx=0;
  var order = (perm&&perm.length===n)?perm:null;
  var card = cards[order?order[st.idx]:st.idx];
  var eng = st.say ? true : st.eng;
  var f = eng?card.en:card.es, b = eng?card.es:card.en;
  $("fl").textContent=(card.tag?card.tag+" · ":"")+(eng?"English":"Español");
  $("ft").textContent=f;
  $("bl").textContent=eng?"Español":"English";
  $("bt").textContent=b;
  $("bn").textContent=card.note||"";
  $("count").textContent="Card "+(st.idx+1)+" of "+n+(st.say?"  ·  Score "+score.c+"/"+score.a:"");
  $("dn").textContent=(st.deck==="All"?"All decks":st.deck)+(perm?", shuffled":"");
  $("inner").className=flipped?"flip":"";
  save();
}
function go(d){ var n=cards.length; resetSay(); flipped=false; st.idx=(st.idx+d+n)%n; render(); }
function flip(){ if(st.say){ revealAnswer(); return; } flipped=!flipped; $("inner").className=flipped?"flip":""; }
function pick(d){ resetSay(); st.deck=d; st.idx=0; flipped=false; perm=null; build(); render(); }
function shuffle(){ resetSay(); var n=cards.length,a=[],i,j,t; for(i=0;i<n;i++)a.push(i); for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;} perm=a; st.idx=0; flipped=false; render(); }

var sel=$("deck");
DECKS.forEach(function(d){ var o=document.createElement("option"); o.value=d; var c=d==="All"?CARDS.length:CARDS.filter(function(x){return x.decks.indexOf(d)>=0;}).length; o.textContent=d+" ("+c+")"; sel.appendChild(o); });
sel.value=st.deck; sel.onchange=function(){pick(sel.value);};
$("eng").checked=st.eng; $("eng").onchange=function(){st.eng=$("eng").checked; flipped=false; render();};
$("saymode").checked=st.say; $("saymode").onchange=function(){ st.say=$("saymode").checked; flipped=false; resetSay(); applyMode(); render(); };
$("prev").onclick=function(){go(-1);}; $("next").onclick=function(){go(1);};
$("flip").onclick=flip; $("shuf").onclick=shuffle;

// Swipe handling on the card area (touch events so preventDefault can stop browser navigation gestures)
var area=$("cardArea"), sx=0, sy=0, tracking=false, moved=false, horiz=false;
area.addEventListener("touchstart",function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; moved=false; horiz=false; },{passive:true});
area.addEventListener("touchmove",function(e){
  if(!tracking) return; var t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>6) horiz=true;
  if(horiz||moved) e.preventDefault();
},{passive:false});
area.addEventListener("touchend",function(e){
  if(!tracking) return; tracking=false; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>=40&&Math.abs(dx)>Math.abs(dy)*1.3){ e.preventDefault(); go(dx<0?1:-1); }
  else if(!moved){ e.preventDefault(); flip(); }

area.addEventListener("touchcancel",function(){tracking=false;});
// mouse / pointer fallback for desktop
var mx=0,my=0,mdown=false;
area.addEventListener("mousedown",function(e){mdown=true;mx=e.clientX;my=e.clientY;});
window.addEventListener("mouseup",function(e){
  if(!mdown) return; mdown=false; var dx=e.clientX-mx, dy=e.clientY-my;
  if(Math.abs(dx)>=40&&Math.abs(dx)>Math.abs(dy)*1.3) go(dx<0?1:-1);
  else if(Math.abs(dx)<8&&Math.abs(dy)<8&&area.contains(e.target)) flip();
});
area.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1); else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}
});
// block page-level scrolling/bounce and pinch zoom

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

var T_SILENCE = 1600, T_SAFETY = 6000;
var timers = {sil:null, safe:null};

function setStatus(msg, cls, heard){
  var s=$("status"); s.textContent=msg; s.className=cls||"";
  $("heard").textContent = heard||"";
}
function applyMode(){
  var on = st.say;
  $("say").className = on ? "" : "hide";
  $("engLbl").className = on ? "tg hide" : "tg";
  $("flip").textContent = on ? "Show answer" : "Flip";
  $("check").className="";
  if(on){
    if(!SR){ setStatus("Speaking mode needs speech recognition, which this browser doesn't have. Try Safari on an iPhone/iPad or Chrome.","warn"); $("mic").disabled=true; }
    else { $("mic").disabled=false; setStatus("Tap the mic and say it in Spanish!",""); }
  }
}
function clearTimers(){ clearTimeout(timers.sil); clearTimeout(timers.safe); timers.sil=timers.safe=null; }
function stopRec(abort){
  sess++; clearTimers();
  if(rec){ var r=rec; rec=null; r.onresult=r.onend=r.onerror=r.onstart=null; try{ abort?r.abort():r.stop(); }catch(e){} }
  listening=false; $("mic").className="";
}
function resetSay(){
  stopRec(true); clearTimeout(advTimer); advTimer=null; misses=0; $("check").className="";
  if(st.say) setStatus(SR?"Tap the mic and say it in Spanish!":$("status").textContent, SR?"":"warn");
}
function ensureAudio(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(!actx&&AC) actx=new AC(); if(actx&&actx.state==="suspended") actx.resume(); }catch(e){}
}
function chime(){
  try{
    ensureAudio(); if(!actx) return;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+i*0.11;
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      o.start(t0); o.stop(t0+0.4);
    });
  }catch(e){}
}

// ----- grading -----
function norm(s){
  s=String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s=s.replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/\b([a-z0-9]+)(?: \1\b)+/g,"$1");   // "hola hola" -> "hola"
  return s;
}
function stripArt(s){ return s.replace(/^(?:(?:el|la|los|las|un|una)\s+)+/,""); }
function lev(a,b){
  var m=a.length,n=b.length,i,j,p=[],c=[];
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){ c[0]=i; for(j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); } p=c.slice(); }
  return p[n];
}
function maxDist(len){ return len<=3?0:Math.round(len*0.2); }
function partMatches(t, target){
  if(!target) return true;
  if((" "+t+" ").indexOf(" "+target+" ")>=0) return true;
  var tw=t.split(" "), kw=target.split(" ").length, md=maxDist(target.length), k, i;
  if(lev(t,target)<=md) return true;
  for(k=Math.max(1,kw-1);k<=kw+1;k++){
    for(i=0;i+k<=tw.length;i++){ if(lev(tw.slice(i,i+k).join(" "),target)<=md) return true; }
  }
  return false;
}
function targetParts(es){
  return es.split("___").map(function(p){ return stripArt(norm(p)); }).filter(function(p){return p.length>0;});
}
function gradeOne(heard, es){
  var t=stripArt(norm(heard));
  if(!t) return false;
  var parts=targetParts(es);
  if(!parts.length) return false;
  return parts.every(function(p){ return partMatches(t,p); });
}
function gradeAny(alts, es){
  for(var i=0;i<alts.length;i++){ if(gradeOne(alts[i],es)) return true; }
  return false;
}
function curCard(){ var n=cards.length, order=(perm&&perm.length===n)?perm:null; return cards[order?order[st.idx]:st.idx]; }

// ----- listening -----
function startListening(){
  ensureAudio();
  if(!SR){ applyMode(); return; }
  if(listening) return;                 // it stops itself; no second tap needed
  clearTimeout(advTimer); advTimer=null; $("check").className="";
  var my=++sess, lastAlts=null, done=false;
  var r;
  try{ r=new SR(); }catch(e){ setStatus("Couldn't start the microphone. Try again.","warn"); return; }
  rec=r; listening=true;
  r.lang=LANGS[langIdx]; r.continuous=false; r.interimResults=true; r.maxAlternatives=5;
  $("mic").className="listening"; setStatus("Listening… say it now!","");
  function finish(alts){
    if(done||my!==sess) return; done=true; clearTimers(); stopRec(false); sess++; grade(alts);
  }
  function noHear(msg){
    if(done||my!==sess) return; done=true; clearTimers(); stopRec(true); setStatus(msg||"Didn't hear you, tap to try again","warn");
  }
  r.onresult=function(e){
    if(my!==sess) return;
    var res=e.results[e.results.length-1], alts=[], j;
    for(j=0;j<res.length;j++) alts.push(res[j].transcript);
    // also include other result segments joined (in case it split the phrase)
    if(e.results.length>1){ var all=[]; for(j=0;j<e.results.length;j++) all.push(e.results[j][0].transcript); alts.push(all.join(" ")); }
    lastAlts=alts; $("heard").textContent="“"+alts[0]+"”";
    if(res.isFinal){ finish(alts); return; }
    clearTimeout(timers.sil);
    timers.sil=setTimeout(function(){ if(done||my!==sess) return; if(lastAlts) finish(lastAlts); else noHear(); }, T_SILENCE);   // silence: end automatically
  };
  r.onerror=function(e){
    if(my!==sess) return; var err=e&&e.error;
    if(err==="no-speech"){ noHear(); }
    else if(err==="aborted"){ if(lastAlts) finish(lastAlts); else noHear(); }
    else if(err==="not-allowed"||err==="service-not-allowed"){ noHear("The microphone is blocked. Allow it in Safari's settings for this site, then tap to try again."); }
    else if(err==="language-not-supported"&&langIdx<LANGS.length-1){ langIdx++; done=true; stopRec(true); startListening(); }
    else if(err==="network"){ noHear("Speech needs an internet connection. Check Wi-Fi and tap to try again."); }
    else { if(lastAlts) finish(lastAlts); else noHear(); }
  };
  r.onend=function(){
    if(done||my!==sess) return;
    if(lastAlts) finish(lastAlts); else noHear();
  };
  timers.safe=setTimeout(function(){ if(done||my!==sess) return; if(lastAlts) finish(lastAlts); else noHear(); }, T_SAFETY);  // safety timeout
  try{ r.start(); }
  catch(e){
    if(langIdx<LANGS.length-1){ langIdx++; done=true; stopRec(true); startListening(); }
    else noHear("Couldn't start the microphone. Tap to try again.");
  }
}
function grade(alts){
  var card=curCard(); score.a++;
  var ok=gradeAny(alts, card.es);
  if(ok){
    score.c++; misses=0;
    flipped=true; $("inner").className="flip";
    $("check").className="show"; chime();
    setStatus("¡Muy bien! Great job!","ok","“"+alts[0]+"”");
    $("count").textContent="Card "+(st.idx+1)+" of "+cards.length+"  ·  Score "+score.c+"/"+score.a;
    clearTimeout(advTimer);
    advTimer=setTimeout(function(){ advTimer=null; go(1); }, 1500);
  } else {
    misses++;
    $("count").textContent="Card "+(st.idx+1)+" of "+cards.length+"  ·  Score "+score.c+"/"+score.a;
    if(misses>=2){
      revealAnswer(true,"“"+alts[0]+"”");
    } else {
      setStatus("Intentá de nuevo / Try again","warn","I heard: “"+alts[0]+"”");
    }
  }
}
function revealAnswer(auto,heard){
  flipped=true; $("inner").className="flip";
  if(st.say) setStatus(auto?"Here's the answer. Practice saying it!":"Here's the answer. Tap the mic to practice!","warn",heard||"");
}
$("mic").onclick=startListening;
applyMode();
build(); render();
</script>
